<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zawayak Design | معرض الأعمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329; /* خلفية كحلي غامق فخم */
            --card-bg: #131c38; /* خلفية البطاقات */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* شبكة عرض الصور بنمط شبيه بالإنستغرام */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1e293b;
            transition: var(--transition);
        }

        .project-card:hover {
            border-color: var(--text-secondary);
        }

        .project-img-container {
            position: relative;
            height: 280px; /* شكل مربع مقارب للإنستغرام */
            cursor: pointer;
            overflow: hidden;
            background-color: #000;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .project-img-container:hover .project-img {
            transform: scale(1.02);
        }

        .project-info {
            padding: 15px;
        }

        .project-title {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .project-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* التصنيف (القائمة) تحت الصورة والوصف + زر الإعجاب */
        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e293b;
            padding-top: 10px;
        }

        .project-category-tag {
            font-size: 0.75rem;
            background-color: #1e293b;
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* زر الإعجاب (قلب) */
        .like-container {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .like-container:hover, .like-container.liked {
            color: #f43f5e;
        }

        .like-icon {
            font-size: 1.1rem;
        }

        /* نافذة تكبير الصور (Lightbox) */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 19, 41, 0.95);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zawayak Design</h1>
        <p>معرض أعمال التصميم الداخلي والهندسة</p>
    </header>

    <div class="container">
        
        <!-- شبكة عرض الأعمال (خالية تماماً لتضيف صورك براحتك) -->
        <div class="portfolio-grid" id="portfolioGrid">
            
            <!-- مثال توضيحي (هيك بيكون شكل الكرت لما تضيف صورك، فيك تحذفه وتضيف مشاريعك) -->
            <div class="project-card" data-category="modern">
                <div class="project-img-container" onclick="openLightbox(this.querySelector('img').src)">
                    <!-- استبدل رابط الصورة برابط صورتك الحقيقية من مستودعك -->
                    <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=800&q=80" alt="مشروع" class="project-img">
                </div>
                <div class="project-info">
                    <h3 class="project-title">اسم المشروع هنا</h3>
                    <p class="project-desc">وصف بسيط عن توزيع الفراغ والإضاءة.</p>
                    
                    <!-- القائمة وزر الإعجاب تحت الصورة -->
                    <div class="card-footer-row">
                        <span class="project-category-tag">مودرن</span>
                        <button class="like-container" onclick="toggleLike(this)">
                            <span class="like-icon">♡</span>
                            <span class="like-count">0</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- نافذة تكبير الصور -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Zawayak Design</p>
    </footer>

    <script>
        // تفاعل زر الإعجاب (القلب)
        function toggleLike(btn) {
            const icon = btn.querySelector('.like-icon');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);

            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                icon.textContent = '♡';
                countSpan.textContent = count - 1;
            } else {
                btn.classList.add('liked');
                icon.textContent = '♥';
                countSpan.textContent = count + 1;
            }
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imgSrc;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
