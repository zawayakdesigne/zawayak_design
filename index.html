<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zawayak Design | معرض الأعمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329; /* خلفية كحلي فاخرة */
            --card-bg: #131c38;  /* لون البطاقات الداكن */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-orange: #e67e22; /* برتقالي الشعار */
            --border-color: #1e293b;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .site-logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 2px solid var(--accent-orange);
            background-color: #fff;
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.25);
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 9px 22px;
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-orange);
            color: #ffffff;
            border-color: var(--accent-orange);
            font-weight: bold;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .project-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            overflow: hidden;
            background-color: #070d1d;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .project-img-container:hover .project-img {
            transform: scale(1.03);
        }

        .project-info {
            padding: 15px;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .project-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .project-category-tag {
            font-size: 0.8rem;
            background-color: rgba(230, 126, 34, 0.15);
            color: var(--accent-orange);
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: 500;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .like-btn:hover, .like-btn.liked {
            color: #f43f5e;
        }

        .like-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 19, 41, 0.95);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox img {
            max-width: 92%;
            max-height: 90vh;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <img src="Screenshot_20261113_012721_Chrome.jpg" alt="Zawayak Design Logo" class="site-logo">
        <h1>Zawayak Design</h1>
        <p>معرض أعمال التصميم الداخلي</p>
    </header>

    <div class="container">
        
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterProjects('all', this)">الكل</button>
            <button class="filter-btn" onclick="filterProjects('modern', this)">مودرن</button>
            <button class="filter-btn" onclick="filterProjects('classic', this)">كلاسيك</button>
            <button class="filter-btn" onclick="filterProjects('neoclassic', this)">نيو كلاسيك</button>
        </div>

        <div class="portfolio-grid" id="portfolioGrid">
            
            <!-- 
            طريقة إضافة مشروع جديد (انسخ هذا الكرت وضعه هنا داخل portfolioGrid):
            في data-category اكتب حصراً: modern أو classic أو neoclassic
            
            <div class="project-card" data-category="modern">
                <div class="project-img-container" onclick="openLightbox(this.querySelector('img').src)">
                    <img src="اسم-صورة-المشروع.jpg" alt="صورة المشروع" class="project-img">
                </div>
                <div class="project-info">
                    <h3 class="project-title">عنوان المشروع</h3>
                    <p class="project-desc">وصف مختصر للمشروع.</p>
                    <div class="card-footer-row">
                        <span class="project-category-tag">مودرن</span>
                        <button class="like-btn" onclick="toggleLike(this)">
                            <span class="like-icon">♡</span>
                            <span class="like-count">0</span>
                        </button>
                    </div>
                </div>
            </div>
            -->

        </div>

    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - Zawayak Design</p>
    </footer>

    <script>
        function filterProjects(category, btn) {
            const cards = document.querySelectorAll('.project-card');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('.like-icon');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);

            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                icon.textContent = '♡';
                countSpan.textContent = count - 1;
            } else {
                btn.classList.add('liked');
                icon.textContent = '♥';
                countSpan.textContent = count + 1;
            }
        }

        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = imgSrc;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>

</body>
</html>
