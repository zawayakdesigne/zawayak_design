<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أعمال زواياك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--slate:#6b7f95;--orange:#f0894a;--peach:#f4e5dc;--ink:#3d4a5a;--line:#dcd6cb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before{content:"";position:absolute;top:-8%;left:-30%;width:75vmax;height:75vmax;max-width:700px;max-height:700px;border-radius:50%;background:var(--peach);opacity:.8}
.bg svg{position:absolute;inset:0;width:100%;height:100%}

.view{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.view.on{display:flex}

#home{justify-content:center;gap:28px;text-align:center}
.logo{width:min(62vw,260px);height:auto}
.logo-img{width:min(80vw,340px);height:auto}
.brand{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;color:var(--slate);line-height:1.2}
.cta{background:var(--orange);color:var(--ink);font-size:1.1rem;font-weight:600;padding:16px 38px;border-radius:999px;box-shadow:0 12px 26px -10px rgba(240,137,74,.7);display:inline-flex;gap:12px;align-items:center;transition:transform .2s}
.cta:active{transform:scale(.97)}

/* زر القائمة */
#menuBtn{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:40;width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--slate)}
#scrim{position:fixed;inset:0;background:rgba(30,36,44,.45);z-index:64;display:none}
#scrim.on{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--bg);z-index:65;transform:translateX(-105%);transition:transform .28s ease;padding:calc(env(safe-area-inset-top) + 16px) 20px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:8px 0 30px -12px rgba(0,0,0,.35)}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh b{font-size:1.2rem;color:var(--slate)}
.x{width:38px;height:38px;border-radius:50%;background:#fff;border:1.5px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center}
.dsec{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px}
.dsec p{font-size:.9rem;line-height:1.7;color:var(--ink);opacity:.8}
.prov{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:.98rem}
.prov i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;flex:none}
.gi{background:#ea4335}.fi{background:#1877f2}
.me{display:flex;align-items:center;gap:12px}
.me img,.me .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--peach);flex:none}
.me b{display:block;color:var(--slate)}
.me small{opacity:.7;font-size:.8rem;word-break:break-all}
.dbtn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:22px;background:var(--orange);color:var(--ink);font-weight:700;font-size:1.05rem}

.top{width:100%;max-width:760px;display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--slate);flex:none}
.top h2{font-size:1.25rem;font-weight:700;color:var(--slate)}

#works{align-items:center}
.cats{width:100%;max-width:560px;display:grid;gap:16px;margin-top:22px}
.cat{background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:34px 26px;text-align:start;display:flex;align-items:center;justify-content:space-between;transition:transform .2s,border-color .2s}
.cat:hover{border-color:var(--orange)}
.cat:active{transform:scale(.985)}
.cat b{font-size:1.7rem;color:var(--slate);font-weight:700}
.cat small{display:block;color:var(--orange);font-weight:600;font-size:.9rem;margin-top:2px}
.cat .arr{width:46px;height:46px;border-radius:50%;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none}
.cat:nth-child(2){border-radius:28px 28px 28px 4px}
.cat:nth-child(3){border-radius:28px 4px 28px 28px}

#gallery{align-items:center}
.profile{width:100%;max-width:760px;display:flex;align-items:center;gap:18px;padding:8px 0 18px}
.avatar{width:74px;height:74px;border-radius:50%;border:2.5px solid var(--orange);background:#fff;display:grid;place-items:center;flex:none}
.avatar svg{width:42px;height:42px}
.profile h1{font-size:1.4rem;color:var(--slate)}
.profile p{opacity:.75;font-size:.95rem}
.tabs{width:100%;max-width:760px;border-top:1.5px solid var(--line);display:flex;justify-content:center;padding:10px 0;color:var(--orange)}
.grid{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-bottom:40px}
.tile{aspect-ratio:1/1;background:var(--line);overflow:hidden;position:relative}
.tile-btn{width:100%;height:100%;display:block;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.tile:hover img{transform:scale(1.05)}
.del{position:absolute;top:6px;inset-inline-start:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--slate)}
.empty b{display:block;font-size:1.15rem;margin-bottom:6px}

.admin{width:100%;max-width:760px;background:#fff;border:1.5px dashed var(--orange);border-radius:18px;padding:12px 14px;display:none;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.admin.on{display:flex}
.admin span{font-size:.9rem;color:var(--slate);font-weight:600}
.btn{background:var(--orange);color:var(--ink);font-weight:600;padding:10px 20px;border-radius:999px;font-size:.95rem}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--slate)}

/* عارض الصور */
#lb{position:fixed;inset:0;background:rgba(30,36,44,.97);z-index:50;display:none;flex-direction:column;color:#fff}
#lb.on{display:flex}
#stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none;min-height:0}
#lbImg{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform}
.lb-btn{position:absolute;color:#fff;background:rgba(255,255,255,.14);width:44px;height:44px;border-radius:50%;font-size:24px;display:grid;place-items:center;z-index:2}
#lbClose{top:max(14px,env(safe-area-inset-top));inset-inline-end:14px}
#lbPrev{top:50%;right:10px;transform:translateY(-50%)}
#lbNext{top:50%;left:10px;transform:translateY(-50%)}
#lbCount{position:absolute;top:max(24px,calc(env(safe-area-inset-top) + 10px));inset-inline-start:16px;opacity:.85;font-size:.95rem;z-index:2}
.info{padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px;background:rgba(30,36,44,.98)}
#lbCap{line-height:1.8;max-height:22vh;overflow:auto;white-space:pre-wrap;font-size:1rem;display:none}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.95rem;color:#fff}
.act svg{width:20px;height:20px}
.act.liked svg{fill:var(--orange);stroke:var(--orange)}
.act.sq{padding:9px 14px;font-size:1.1rem}

/* التعليقات */
#cm{position:fixed;left:0;right:0;bottom:0;height:70vh;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:55;transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;color:var(--ink)}
#cm.on{transform:none}
.cm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.cm-head b{color:var(--slate);font-size:1.1rem}
#cmList{flex:1;overflow:auto;padding:6px 18px;display:grid;gap:14px;align-content:start}
.c{display:flex;gap:10px;align-items:flex-start}
.c img,.c .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--peach);flex:none}
.c .bd{flex:1;min-width:0}
.c b{font-size:.9rem;color:var(--slate)}
.c small{opacity:.55;font-size:.75rem;margin-inline-start:6px}
.c p{line-height:1.7;word-break:break-word;white-space:pre-wrap}
.c .cd{font-size:.8rem;color:#b3402a;padding:2px 6px}
#cmForm{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line)}
#cmForm input{flex:1;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);font-family:inherit;font-size:1rem;background:#fff;min-width:0}
#cmLogin{margin:12px 16px calc(14px + env(safe-area-inset-bottom))}

#login,#capModal{position:fixed;inset:0;background:rgba(30,36,44,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#login.on,#capModal.on{display:flex}
.card{background:var(--bg);border-radius:26px;padding:26px;width:100%;max-width:420px;display:grid;gap:14px;color:var(--ink)}
.card h3{color:var(--slate)}
.card p{font-size:.88rem;opacity:.8;line-height:1.7}
.card input,.card textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-family:inherit;font-size:1rem;background:#fff}
#tokenInput{direction:ltr}
.card textarea{min-height:140px;resize:vertical}
.card .row{display:flex;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;z-index:80;font-size:.95rem;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 400 800" preserveAspectRatio="none">
    <path d="M0 70 C140 60 260 130 400 160" fill="none" stroke="#cfcac1" stroke-width="1"/>
    <path d="M0 420 C120 440 220 330 400 240" fill="none" stroke="#cfcac1" stroke-width="1"/>
    <path d="M0 560 C140 600 240 560 400 400" fill="none" stroke="#f3b184" stroke-width="1.2"/>
  </svg>
</div>

<!-- زر القائمة + القائمة الجانبية -->
<button id="menuBtn" aria-label="القائمة">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div id="scrim"></div>
<aside id="drawer" aria-label="القائمة">
  <div class="dh"><b>القائمة</b><button class="x" id="menuClose" aria-label="إغلاق">×</button></div>
  <div class="dsec" id="authBox"></div>
  <button class="dbtn" id="contactBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
    التواصل معنا
  </button>
</aside>

<main class="view on" id="home">
  <div id="logoBox"></div>
  <button class="cta" id="goWorks">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    عرض الأعمال
  </button>
</main>

<section class="view" id="works">
  <div class="top">
    <button class="back" data-go="#/" aria-label="رجوع"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2>أعمالنا</h2>
  </div>
  <div class="cats">
    <button class="cat" data-go="#/works/modern"><span><b>مودرن</b><small>Modern</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
    <button class="cat" data-go="#/works/neoclassic"><span><b>نيو كلاسيك</b><small>Neo Classic</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
    <button class="cat" data-go="#/works/classic"><span><b>كلاسيك</b><small>Classic</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
  </div>
</section>

<section class="view" id="gallery">
  <div class="top">
    <button class="back" data-go="#/works" aria-label="رجوع"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2>أعمال زواياك</h2>
  </div>
  <div class="profile">
    <div class="avatar" id="avatar"></div>
    <div><h1 id="gTitle"></h1><p id="gCount"></p></div>
  </div>
  <div class="admin" id="adminBar">
    <span>وضع المدير</span>
    <div style="display:flex;gap:8px">
      <button class="btn" id="addBtn">+ إضافة صور</button>
      <button class="btn ghost" id="logoutBtn">خروج</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <div class="tabs" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- عارض الصور -->
<div id="lb" role="dialog" aria-modal="true">
  <div id="stage">
    <button class="lb-btn" id="lbClose" aria-label="إغلاق">×</button>
    <span id="lbCount"></span>
    <img id="lbImg" alt="" draggable="false">
    <button class="lb-btn" id="lbPrev" aria-label="السابق">›</button>
    <button class="lb-btn" id="lbNext" aria-label="التالي">‹</button>
  </div>
  <div class="info">
    <div id="lbCap"></div>
    <div class="acts">
      <button class="act" id="likeBtn" aria-label="إعجاب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="likeN">0</span>
      </button>
      <button class="act" id="cmBtn" aria-label="التعليقات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.800 7L3 21l2-5.500A8 8 0 1 1 21 12z"/></svg>
        <span id="cmN">0</span>
      </button>
      <button class="act sq" id="zin" aria-label="تكبير">+</button>
      <button class="act sq" id="zout" aria-label="تصغير">−</button>
      <button class="act" id="editCap" style="display:none">✎ شرح</button>
    </div>
  </div>
</div>

<!-- التعليقات -->
<div id="cm" role="dialog" aria-label="التعليقات">
  <div class="cm-head"><b>التعليقات</b><button class="x" id="cmClose" aria-label="إغلاق">×</button></div>
  <div id="cmList"></div>
  <button class="btn" id="cmLogin" style="display:none">سجّل الدخول للتعليق</button>
  <div id="cmForm" style="display:none">
    <input id="cmInput" maxlength="500" placeholder="اكتب تعليقاً..." autocomplete="off">
    <button class="btn" id="cmSend">نشر</button>
  </div>
</div>

<!-- نافذة تعديل الشرح -->
<div id="capModal">
  <div class="card">
    <h3>شرح الصورة</h3>
    <textarea id="capText" placeholder="اكتب شرحاً للصورة..."></textarea>
    <div class="row"><button class="btn" id="capSave">حفظ</button><button class="btn ghost" id="capCancel">إلغاء</button></div>
  </div>
</div>

<!-- رمز GitHub لإدارة الصور -->
<div id="login">
  <div class="card">
    <h3>إدارة الصور</h3>
    <p>الصق رمز GitHub الخاص بك (Fine-grained token بصلاحية Contents: Read and write لهذا المستودع فقط). يُحفظ في متصفحك أنت فقط.</p>
    <input id="tokenInput" type="password" placeholder="github_pat_..." autocomplete="off">
    <div class="row">
      <button class="btn" id="tokenOk">دخول</button>
      <button class="btn ghost" id="tokenCancel">إلغاء</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* ================= الإعدادات ================= */
const CONFIG = {
  owner: "", repo: "", branch: "main",
  logoImage: "",
  contactEmail: "",                              // ← ضع إيميل التواصل هنا لاحقاً
  ownerEmail: "mohanadsarakbyvvv22@gmail.com",   // ← المدير الوحيد
  firebase: {                                    // ← من إعدادات Firebase
    apiKey: "", authDomain: "", projectId: "", appId: ""
  }
};
const CATS = {
  modern:     { name: "مودرن" },
  neoclassic: { name: "نيو كلاسيك" },
  classic:    { name: "كلاسيك" }
};
/* ============================================= */

if(!CONFIG.owner && location.hostname.endsWith("github.io")){
  CONFIG.owner = location.hostname.split(".")[0];
  CONFIG.repo  = CONFIG.repo || location.pathname.split("/")[1] || (CONFIG.owner + ".github.io");
}
const $ = s => document.querySelector(s);
const API = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
const TOKEN_KEY = "zawiyak_token";
const getToken = () => { try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""} };
const isAdmin = () => !!getToken();
const FB_ON = !!CONFIG.firebase.apiKey;
let auth, db, fs, authM, user = null;
const OWNER_OK = u => !!(u && CONFIG.ownerEmail && u.email===CONFIG.ownerEmail && u.emailVerified);

const logoSVG = (cls="logo") => `
<svg class="${cls}" viewBox="190 165 345 345" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="11" aria-label="شعار زواياك">
  <path d="M203 345V178H490" stroke="#6b7f95"/><path d="M233 486H518" stroke="#6b7f95"/>
  <path d="M250 228H468" stroke="#f0894a"/><path d="M508 180L207 487" stroke="#f0894a"/>
  <path d="M399 422V350L458 316L517 350V422" stroke="#6b7f95"/>
  <path d="M444 420V386H464V420" stroke="#f0894a"/><path d="M441 439H518" stroke="#f0894a"/>
</svg>`;
function buildHome(){
  $("#logoBox").innerHTML = CONFIG.logoImage
    ? `<img class="logo-img" src="${CONFIG.logoImage}" alt="أعمال زواياك">`
    : `${logoSVG()}<div class="brand" style="margin-top:18px">أعمال زوايـاك</div>`;
  $("#avatar").innerHTML = logoSVG("");
}
function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms); }

/* ================= التنقل ================= */
function show(id){ document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id)); window.scrollTo(0,0); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) location.hash=b.dataset.go; });
$("#goWorks").onclick = () => location.hash = "#/works";
let current=null, items=[], captions={};
function route(){
  const [p,c] = location.hash.replace(/^#\/?/,"").split("/");
  if(p==="works" && CATS[c]){ show("gallery"); loadGallery(c); }
  else if(p==="works") show("works");
  else show("home");
}
window.addEventListener("hashchange",route);

/* ================= القائمة الجانبية + تسجيل الدخول ================= */
function openMenu(){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); }
function closeMenu(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#menuBtn").onclick = openMenu; $("#menuClose").onclick = closeMenu; $("#scrim").onclick = closeMenu;
$("#contactBtn").onclick = () => {
  if(CONFIG.contactEmail) location.href = "mailto:" + CONFIG.contactEmail;
  else toast("سيتم إضافة وسيلة التواصل قريباً");
};
function renderMenu(){
  const box = $("#authBox"); box.innerHTML = "";
  if(user){
    box.innerHTML = `<div class="me"><span class="ph" id="mePh"></span><div><b id="meName"></b><small id="meMail"></small></div></div>
      ${OWNER_OK(user) ? '<p>أنت مسجّل كمدير: يمكنك حذف التعليقات.</p><button class="btn" id="imgAdmin">إدارة الصور (GitHub)</button>' : ''}
      <button class="btn ghost" id="outBtn">تسجيل الخروج</button>`;
    $("#meName").textContent = user.displayName || "مستخدم";
    $("#meMail").textContent = user.email || "";
    if(user.photoURL){ const im=document.createElement("img"); im.src=user.photoURL; im.alt=""; im.referrerPolicy="no-referrer"; $("#mePh").replaceWith(im); }
    $("#outBtn").onclick = async () => { await authM.signOut(auth); toast("تم تسجيل الخروج"); };
    const ia=$("#imgAdmin"); if(ia) ia.onclick=()=>{ closeMenu(); openLogin(); };
  }else{
    box.innerHTML = `<p>سجّل دخولك للإعجاب والتعليق على الأعمال</p>
      <button class="prov" id="gBtn"><i class="gi">G</i> المتابعة عبر Google</button>
      <button class="prov" id="fBtn"><i class="fi">f</i> المتابعة عبر Facebook</button>`;
    $("#gBtn").onclick = () => signIn("g"); $("#fBtn").onclick = () => signIn("f");
  }
}
async function signIn(k){
  if(!FB_ON){ toast("تسجيل الدخول غير مفعّل بعد"); return; }
  try{
    const prov = k==="g" ? new authM.GoogleAuthProvider() : new authM.FacebookAuthProvider();
    await authM.signInWithPopup(auth, prov);
    closeMenu(); toast("تم تسجيل الدخول");
  }catch(e){ toast("لم يكتمل تسجيل الدخول"); }
}
async function ownerSignIn(){
  if(!FB_ON){ toast("Firebase غير مفعّل بعد"); return; }
  if(OWNER_OK(user)){ openLogin(); return; }
  try{
    const res = await authM.signInWithPopup(auth, new authM.GoogleAuthProvider());
    if(!OWNER_OK(res.user)){ await authM.signOut(auth); toast("هذا الحساب غير مسموح له بالدخول كمدير"); return; }
    toast("تم تسجيل دخولك كمدير");
  }catch(e){ toast("لم يكتمل تسجيل الدخول"); }
}
let taps=0,tapT;
$("#logoBox").addEventListener("click",()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500); if(taps>=5){taps=0;ownerSignIn();} });

/* ================= المعرض ================= */
function headers(){ const h={Accept:"application/vnd.github+json"}; if(isAdmin()) h.Authorization="Bearer "+getToken(); return h; }
const dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g,""))));
const enc = s => btoa(unescape(encodeURIComponent(s)));

async function fetchList(cat){
  const r = await fetch(`${API}/images/${cat}?ref=${CONFIG.branch}&t=${Date.now()}`,{headers:headers(),cache:"no-store"});
  
  // إذا كانت القائمة هي "مودرن"، نقوم بإدراج الصورة MZ1 المرفقة محلياً بجانب صور GitHub
  let githubFiles = [];
  if(r.ok){
    githubFiles = (await r.json()).filter(f=>/\.(jpe?g|png|webp|gif|avif)$/i.test(f.name))
      .map(f=>({name:f.name,sha:f.sha,url:f.download_url,path:f.path}));
  }
  
  if(cat === "modern"){
    const mz1Item = {
      name: "MZ1.jpg",
      sha: "local_mz1",
      url: "5262.jpg", // رابط الصورة المرفقة في المحادثة
      path: "images/modern/MZ1.jpg"
    };
    // إضافة الصورة MZ1 كأول عنصر في القائمة
    githubFiles.unshift(mz1Item);
  }

  return githubFiles.sort((a,b)=>b.name.localeCompare(a.name));
}

async function fetchCaptions(){
  try{
    const r = await fetch(`${API}/images/captions.json?ref=${CONFIG.branch}&t=${Date.now()}`,{headers:headers(),cache:"no-store"});
    if(!r.ok) return {};
    return JSON.parse(dec((await r.json()).content));
  }catch(e){ return {}; }
}
async function loadGallery(cat){
  current = cat;
  $("#gTitle").textContent = CATS[cat].name;
  $("#gCount").textContent = "جاري التحميل...";
  $("#grid").innerHTML = "";
  $("#adminBar").classList.toggle("on", isAdmin());
  try{ [items, captions] = await Promise.all([fetchList(cat), fetchCaptions()]); }
  catch(err){
    items=[]; $("#gCount").textContent="";
    $("#grid").innerHTML = `<div class="empty"><b>تعذر تحميل الصور</b>تأكد من اتصالك بالإنترنت وحاول مرة أخرى.</div>`; return;
  }
  renderGrid();
}
function renderGrid(){
  $("#gCount").textContent = items.length ? `${items.length} صورة` : "";
  const g=$("#grid");
  if(!items.length){
    g.innerHTML = `<div class="empty"><b>لا توجد صور بعد</b>${isAdmin()?"اضغط «إضافة صور» لرفع أول أعمالك.":"سيتم إضافة الأعمال قريباً."}</div>`; return;
  }
  g.innerHTML="";
  items.forEach((it,i)=>{
    const t=document.createElement("div"); t.className="tile";
    t.innerHTML=`<button class="tile-btn" aria-label="عرض الصورة ${i+1}"><img loading="lazy" src="${it.url}" alt="${CATS[current].name} ${i+1}"></button>`;
    t.firstChild.onclick=()=>openLB(i);
    if(isAdmin() && it.sha !== "local_mz1"){
      const d=document.createElement("button"); d.className="del"; d.textContent="×"; d.setAttribute("aria-label","حذف");
      d.onclick=ev=>{ev.stopPropagation(); removeImage(it);}; t.appendChild(d);
    }
    g.appendChild(t);
  });
}

/* ================= عارض الصور + الزوم ================= */
let li=0, unsubL=null, unsubC=null, likeCount=0, liked=false, comments=[];
const photoKey = it => current + "_" + it.name.replace(/\.[^.]+$/,"");
function openLB(i){ li=i; $("#lb").classList.add("on"); document.body.style.overflow="hidden"; showPhoto(); }
function closeLB(){ $("#lb").classList.remove("on"); $("#cm").classList.remove("on"); document.body.style.overflow=""; unsubL&&unsubL(); unsubC&&unsubC(); unsubL=unsubC=null; }
function stepLB(d){ li=(li+d+items.length)%items.length; showPhoto(); }
function showPhoto(){
  const it=items[li]; resetZoom();
  $("#lbImg").src=it.url; $("#lbCount").textContent=`${li+1} / ${items.length}`;
  const cap=captions[it.path]||""; const c=$("#lbCap"); c.textContent=cap; c.style.display=cap?"block":"none";
  $("#editCap").style.display = (isAdmin() && it.sha !== "local_mz1") ? "inline-flex" : "none";
  bindPhoto();
}
function bindPhoto(){
  unsubL&&unsubL(); unsubC&&unsubC(); unsubL=unsubC=null;
  likeCount=0; liked=false; comments=[]; renderActs(); renderComments();
  if(!FB_ON || !$("#lb").classList.contains("on") || !items[li]) return;
  const key=photoKey(items[li]);
  unsubL=fs.onSnapshot(fs.collection(db,"photos",key,"likes"),s=>{
    likeCount=s.size; liked=!!user && s.docs.some(d=>d.id===user.uid); renderActs();
  },()=>{});
  unsubC=fs.onSnapshot(fs.query(fs.collection(db,"photos",key,"comments"),fs.orderBy("ts","asc")),s=>{
    comments=s.docs.map(d=>({id:d.id,...d.data()})); renderActs(); renderComments();
  },()=>{});
}
function renderActs(){
  $("#likeN").textContent=likeCount; $("#cmN").textContent=comments.length;
  $("#likeBtn").classList.toggle("liked",liked);
}
$("#likeBtn").onclick = async () => {
  if(!FB_ON){ toast("الإعجاب غير مفعّل بعد"); return; }
  if(!user){ toast("سجّل الدخول أولاً"); openMenu(); return; }
  const ref=fs.doc(db,"photos",photoKey(items[li]),"likes",user.uid);
  try{ liked ? await fs.deleteDoc(ref) : await fs.setDoc(ref,{ts:fs.serverTimestamp()}); }catch(e){ toast("تعذر تنفيذ الإعجاب"); }
};
function renderComments(){
  const list=$("#cmList"); list.innerHTML="";
  if(!comments.length){
    const p=document.createElement("p"); p.style.cssText="text-align:center;opacity:.6;padding:30px 0";
    p.textContent=FB_ON?"لا توجد تعليقات بعد، كن أول من يعلّق":"التعليقات غير مفعّلة بعد"; list.appendChild(p);
  }
  comments.forEach(c=>{
    const row=document.createElement("div"); row.className="c";
    let av;
    if(c.photo && /^https:\/\//.test(c.photo)){ av=document.createElement("img"); av.src=c.photo; av.alt=""; av.referrerPolicy="no-referrer"; }
    else{ av=document.createElement("span"); av.className="ph"; }
    const bd=document.createElement("div"); bd.className="bd";
    const n=document.createElement("b"); n.textContent=c.name||"مستخدم";
    const tm=document.createElement("small"); tm.textContent=c.ts&&c.ts.toDate?c.ts.toDate().toLocaleDateString("ar"):"";
    const tx=document.createElement("p"); tx.textContent=c.text;
    const h=document.createElement("div"); h.append(n,tm); bd.append(h,tx);
    if(OWNER_OK(user)){
      const d=document.createElement("button"); d.className="cd"; d.textContent="حذف";
      d.onclick=()=>fs.deleteDoc(fs.doc(db,"photos",photoKey(items[li]),"comments",c.id)).catch(()=>toast("تعذر الحذف"));
      bd.appendChild(d);
    }
    row.append(av,bd); list.appendChild(row);
  });
  $("#cmForm").style.display = user ? "flex" : "none";
  $("#cmLogin").style.display = user ? "none" : "block";
}
$("#cmBtn").onclick=()=>{ $("#cm").classList.add("on"); renderComments(); };
$("#cmClose").onclick=()=>$("#cm").classList.remove("on");
$("#cmLogin").onclick=()=>{ if(!FB_ON){toast("التعليقات غير مفعّلة بعد");return;} openMenu(); };
async function sendComment(){
  const v=$("#cmInput").value.trim(); if(!v||!user) return;
  try{
    await fs.addDoc(fs.collection(db,"photos",photoKey(items[li]),"comments"),
      {uid:user.uid,name:(user.displayName||"مستخدم").slice(0,30),photo:user.photoURL||"",text:v.slice(0,500),ts:fs.serverTimestamp()});
    $("#cmInput").value="";
  }catch(e){ toast("تعذر نشر التعليق"); }
}
$("#cmSend").onclick=sendComment;
$("#cmInput").addEventListener("keydown",e=>{ if(e.key==="Enter") sendComment(); });

/* الزوم */
const st=$("#stage"), img=$("#lbImg");
let Z={s:1,x:0,y:0}, ptrs=new Map(), pinch=null, startPt=null, lastTap=0;
const applyZ=()=>{ img.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; };
function resetZoom(){ Z={s:1,x:0,y:0}; applyZ(); }
function setScale(s){ Z.s=Math.min(5,Math.max(1,s)); if(Z.s===1){Z.x=0;Z.y=0;} applyZ(); }
st.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")) return;
  st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) startPt={x:e.clientX,y:e.clientY,t:Date.now(),moved:false};
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:Z.s}; startPt=null; }
});
st.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()]; setScale(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d); return; }
  if(startPt && Math.hypot(e.clientX-startPt.x,e.clientY-startPt.y)>10) startPt.moved=true;
  if(Z.s>1){ Z.x+=dx; Z.y+=dy; applyZ(); }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(startPt && e.type==="pointerup"){
    const dx=e.clientX-startPt.x, dy=e.clientY-startPt.y;
    if(!startPt.moved && Date.now()-startPt.t<300){
      const n=Date.now();
      if(n-lastTap<320){ setScale(Z.s>1?1:2.5); lastTap=0; } else lastTap=n;
    }else if(Z.s===1 && Math.abs(dx)>60 && Math.abs(dy)<90){ stepLB(dx>0?-1:1); }
  }
  startPt=null;
}
st.addEventListener("pointerup",endPtr); st.addEventListener("pointercancel",endPtr);
st.addEventListener("wheel",e=>{ e.preventDefault(); setScale(Z.s*(e.deltaY<0?1.15:.87)); },{passive:false});
$("#zin").onclick=()=>setScale(Z.s+.7); $("#zout").onclick=()=>setScale(Z.s-.7);
$("#lbClose").onclick=closeLB; $("#lbPrev").onclick=()=>stepLB(-1); $("#lbNext").onclick=()=>stepLB(1);
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("on")) return;
  if(e.key==="Escape"){ $("#cm").classList.contains("on") ? $("#cm").classList.remove("on") : closeLB(); }
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key==="ArrowRight") stepLB(-1);
  if(e.key==="ArrowLeft") stepLB(1);
});

/* ================= إدارة الصور (رمز GitHub) ================= */
function openLogin(){ $("#login").classList.add("on"); $("#tokenInput").value=""; setTimeout(()=>$("#tokenInput").focus(),50); }
$("#tokenCancel").onclick=()=>$("#login").classList.remove("on");
$("#tokenOk").onclick=async()=>{
  const tk=$("#tokenInput").value.trim(); if(!tk) return;
  try{
    const r=await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`,{headers:{Authorization:"Bearer "+tk,Accept:"application/vnd.github+json"}});
    const j=await r.json(); if(!r.ok||!(j.permissions&&j.permissions.push)) throw 0;
    localStorage.setItem(TOKEN_KEY,tk); $("#login").classList.remove("on"); toast("تم تفعيل إدارة الصور");
    if(current) loadGallery(current);
  }catch(e){ toast("الرمز غير صحيح أو لا يملك صلاحية الكتابة"); }
};
$("#logoutBtn").onclick=()=>{ try{localStorage.removeItem(TOKEN_KEY)}catch(e){} $("#adminBar").classList.remove("on"); renderGrid(); toast("تم الخروج من إدارة الصور"); };
$("#addBtn").onclick=()=>$("#fileInput").click();

function compress(file,max=1600,q=.85){
  return new Promise((res,rej)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",q).split(",")[1]); };
    im.onerror=rej; im.src=u;
  });
}
$("#fileInput").onchange=async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length||!current) return;
  let ok=0;
  for(let i=0;i<files.length;i++){
    toast(`جاري رفع الصورة ${i+1} من ${files.length}...`,60000);
    try{
      const b64=await compress(files[i]);
      const r=await fetch(`${API}/images/${current}/${Date.now()}-${i}.jpg`,{method:"PUT",headers:{...headers(),"Content-Type":"application/json"},
        body:JSON.stringify({message:`add ${current} image`,content:b64,branch:CONFIG.branch})});
      if(!r.ok) throw 0; ok++;
    }catch(err){ toast("فشل رفع إحدى الصور"); }
  }
  toast(`تم رفع ${ok} صورة`); loadGallery(current);
};
async function removeImage(it){
  if(!confirm("هل تريد حذف هذه الصورة نهائياً؟")) return;
  const r=await fetch(`${API}/${it.path}`,{method:"DELETE",headers:{...headers(),"Content-Type":"application/json"},
    body:JSON.stringify({message:"delete image",sha:it.sha,branch:CONFIG.branch})});
  if(r.ok){ toast("تم الحذف"); items=items.filter(x=>x!==it); renderGrid(); } else toast("تعذر الحذف");
}

/* شرح الصورة */
$("#editCap").onclick=()=>{ $("#capText").value=captions[items[li].path]||""; $("#capModal").classList.add("on"); };
$("#capCancel").onclick=()=>$("#capModal").classList.remove("on");
$("#capSave").onclick=async()=>{
  const path=items[li].path, text=$("#capText").value.trim();
  try{
    const url=`${API}/images/captions.json`;
    let sha, data={};
    const r=await fetch(`${url}?ref=${CONFIG.branch}&t=${Date.now()}`,{headers:headers(),cache:"no-store"});
    if(r.ok){ const j=await r.json(); sha=j.sha; data=JSON.parse(dec(j.content)); }
    if(text) data[path]=text; else delete data[path];
    const body={message:"update captions",content:enc(JSON.stringify(data,null,1)),branch:CONFIG.branch}; if(sha) body.sha=sha;
    const w=await fetch(url,{method:"PUT",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!w.ok) throw 0;
    captions=data; $("#capModal").classList.remove("on"); showPhoto(); toast("تم حفظ الشرح");
  }catch(e){ toast("تعذر حفظ الشرح"); }
};

/* ================= تشغيل Firebase ================= */
if(FB_ON){
  try{
    const V="10.12.2", B=`https://www.gstatic.com/firebasejs/${V}/`;
    const [appM,aM,fM]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    const app=appM.initializeApp(CONFIG.firebase);
    auth=aM.getAuth(app); db=fM.getFirestore(app); authM=aM; fs=fM;
    aM.onAuthStateChanged(auth,u=>{ user=u; renderMenu(); bindPhoto(); });
  }catch(e){ console.error(e); }
}
buildHome(); renderMenu(); route();
</script>
