<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أعمال زواياك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --slate:#6b7f95; --orange:#f0894a; --peach:#f4e5dc; --ink:#3d4a5a;
  --line:#dcd6cb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before{content:"";position:absolute;top:-8%;left:-30%;width:75vmax;height:75vmax;max-width:700px;max-height:700px;border-radius:50%;background:var(--peach);opacity:.8}
.bg svg{position:absolute;inset:0;width:100%;height:100%}

.view{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.view.on{display:flex}

#home{justify-content:center;gap:28px;text-align:center}
.logo{width:min(62vw,260px);height:auto}
.logo-img{width:min(80vw,340px);height:auto}
.brand{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;color:var(--slate);line-height:1.2}
.cta{background:var(--orange);color:var(--ink);font-size:1.1rem;font-weight:600;padding:16px 38px;border-radius:999px;box-shadow:0 12px 26px -10px rgba(240,137,74,.7);display:inline-flex;gap:12px;align-items:center;transition:transform .2s}
.cta:active{transform:scale(.97)}

.top{width:100%;max-width:760px;display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--slate);flex:none}
.top h2{font-size:1.25rem;font-weight:700;color:var(--slate)}
.mini{width:34px;height:34px;margin-inline-start:auto}

#works{align-items:center}
.cats{width:100%;max-width:560px;display:grid;gap:16px;margin-top:22px}
.cat{position:relative;overflow:hidden;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:34px 26px;text-align:start;display:flex;align-items:center;justify-content:space-between;transition:transform .2s,border-color .2s}
.cat:hover{border-color:var(--orange)}
.cat:active{transform:scale(.985)}
.cat b{font-size:1.7rem;color:var(--slate);font-weight:700}
.cat small{display:block;color:var(--orange);font-weight:600;font-size:.9rem;margin-top:2px}
.cat .arr{width:46px;height:46px;border-radius:50%;background:var(--orange);display:grid;place-items:center;color:#fff;flex:none}
.cat:nth-child(2){border-radius:28px 28px 28px 4px}
.cat:nth-child(3){border-radius:28px 4px 28px 28px}

#gallery{align-items:center}
.profile{width:100%;max-width:760px;display:flex;align-items:center;gap:18px;padding:8px 0 18px}
.avatar{width:74px;height:74px;border-radius:50%;border:2.5px solid var(--orange);background:#fff;display:grid;place-items:center;flex:none}
.avatar svg{width:42px;height:42px}
.profile h1{font-size:1.4rem;color:var(--slate)}
.profile p{color:var(--ink);opacity:.75;font-size:.95rem}
.tabs{width:100%;max-width:760px;border-top:1.5px solid var(--line);display:flex;justify-content:center;padding:10px 0;color:var(--orange)}
.grid{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-bottom:40px}
.tile{aspect-ratio:1/1;background:var(--line);overflow:hidden;position:relative;display:block;padding:0}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.tile:hover img{transform:scale(1.05)}
.del{position:absolute;top:6px;inset-inline-start:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--slate)}
.empty b{display:block;font-size:1.15rem;margin-bottom:6px}

.admin{width:100%;max-width:760px;background:#fff;border:1.5px dashed var(--orange);border-radius:18px;padding:12px 14px;display:none;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.admin.on{display:flex}
.admin span{font-size:.9rem;color:var(--slate);font-weight:600}
.btn{background:var(--orange);color:var(--ink);font-weight:600;padding:10px 20px;border-radius:999px;font-size:.95rem}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--slate)}

#lb{position:fixed;inset:0;background:rgba(30,36,44,.96);z-index:50;display:none;align-items:center;justify-content:center;touch-action:pan-y}
#lb.on{display:flex}
#lb img{max-width:100vw;max-height:86vh;object-fit:contain;user-select:none}
.lb-btn{position:absolute;color:#fff;background:rgba(255,255,255,.14);width:46px;height:46px;border-radius:50%;font-size:24px;display:grid;place-items:center}
#lbClose{top:max(16px,env(safe-area-inset-top));inset-inline-end:16px}
#lbPrev{top:50%;right:12px;transform:translateY(-50%)}
#lbNext{top:50%;left:12px;transform:translateY(-50%)}
#lbCount{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));color:#fff;opacity:.8;font-size:.95rem}

#login{position:fixed;inset:0;background:rgba(30,36,44,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#login.on{display:flex}
.card{background:var(--bg);border-radius:26px;padding:26px;width:100%;max-width:420px;display:grid;gap:14px}
.card h3{color:var(--slate)}
.card p{font-size:.88rem;opacity:.8;line-height:1.7}
.card input{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-family:inherit;font-size:1rem;direction:ltr;background:#fff}
.card .row{display:flex;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;z-index:70;font-size:.95rem;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 400 800" preserveAspectRatio="none">
    <path d="M0 70 C140 60 260 130 400 160" fill="none" stroke="#cfcac1" stroke-width="1"/>
    <path d="M0 420 C120 440 220 330 400 240" fill="none" stroke="#cfcac1" stroke-width="1"/>
    <path d="M0 560 C140 600 240 560 400 400" fill="none" stroke="#f3b184" stroke-width="1.2"/>
  </svg>
</div>

<main class="view on" id="home">
  <div id="logoBox"></div>
  <button class="cta" id="goWorks">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    عرض الأعمال
  </button>
</main>

<section class="view" id="works">
  <div class="top">
    <button class="back" data-go="#/" aria-label="رجوع"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2>أعمالنا</h2>
    <span class="mini" id="miniLogo1"></span>
  </div>
  <div class="cats">
    <button class="cat" data-go="#/works/modern"><span><b>مودرن</b><small>Modern</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
    <button class="cat" data-go="#/works/neoclassic"><span><b>نيو كلاسيك</b><small>Neo Classic</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
    <button class="cat" data-go="#/works/classic"><span><b>كلاسيك</b><small>Classic</small></span><span class="arr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></button>
  </div>
</section>

<section class="view" id="gallery">
  <div class="top">
    <button class="back" data-go="#/works" aria-label="رجوع"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2>أعمال زواياك</h2>
  </div>
  <div class="profile">
    <div class="avatar" id="avatar"></div>
    <div><h1 id="gTitle"></h1><p id="gCount"></p></div>
  </div>
  <div class="admin" id="adminBar">
    <span>وضع المدير: يمكنك إضافة وحذف الصور</span>
    <div style="display:flex;gap:8px">
      <button class="btn" id="addBtn">+ إضافة صور</button>
      <button class="btn ghost" id="logoutBtn">خروج</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <div class="tabs" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </div>
  <div class="grid" id="grid"></div>
</section>

<div id="lb" role="dialog" aria-modal="true">
  <button class="lb-btn" id="lbClose" aria-label="إغلاق">×</button>
  <button class="lb-btn" id="lbPrev" aria-label="السابق">›</button>
  <img id="lbImg" alt="">
  <button class="lb-btn" id="lbNext" aria-label="التالي">‹</button>
  <div id="lbCount"></div>
</div>

<div id="login">
  <div class="card">
    <h3>دخول المدير</h3>
    <p>الصق رمز GitHub الخاص بك (Fine-grained token بصلاحية Contents: Read and write لهذا المستودع فقط). يُحفظ في متصفحك أنت فقط.</p>
    <input id="tokenInput" type="password" placeholder="github_pat_..." autocomplete="off">
    <div class="row">
      <button class="btn" id="tokenOk">دخول</button>
      <button class="btn ghost" id="tokenCancel">إلغاء</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  owner: "",
  repo: "",
  branch: "main",
  logoImage: ""
};
const CATS = {
  modern:     { name: "مودرن",       en: "Modern" },
  neoclassic: { name: "نيو كلاسيك", en: "Neo Classic" },
  classic:    { name: "كلاسيك",      en: "Classic" }
};

(function detect(){
  if(!CONFIG.owner && location.hostname.endsWith("github.io")){
    CONFIG.owner = location.hostname.split(".")[0];
    CONFIG.repo  = CONFIG.repo || location.pathname.split("/")[1] || (CONFIG.owner + ".github.io");
  }
})();

const $ = s => document.querySelector(s);
const API = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
const TOKEN_KEY = "zawiyak_token";
const getToken = () => { try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""} };
const isAdmin = () => !!getToken();

const logoSVG = (cls="logo") => `
<svg class="${cls}" viewBox="190 165 345 345" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="11" aria-label="شعار زواياك">
  <path d="M203 345V178H490" stroke="#6b7f95"/>
  <path d="M233 486H518" stroke="#6b7f95"/>
  <path d="M250 228H468" stroke="#f0894a"/>
  <path d="M508 180L207 487" stroke="#f0894a"/>
  <path d="M399 422V350L458 316L517 350V422" stroke="#6b7f95"/>
  <path d="M444 420V386H464V420" stroke="#f0894a"/>
  <path d="M441 439H518" stroke="#f0894a"/>
</svg>`;

function buildHome(){
  $("#logoBox").innerHTML = CONFIG.logoImage
    ? `<img class="logo-img" src="${CONFIG.logoImage}" alt="أعمال زواياك">`
    : `${logoSVG()}<div class="brand" style="margin-top:18px">أعمال زوايـاك</div>`;
  $("#miniLogo1").innerHTML = logoSVG("mini");
  $("#avatar").innerHTML = logoSVG("");
}

function show(id){ document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id)); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const b = e.target.closest("[data-go]"); if(b) location.hash = b.dataset.go;
});
$("#goWorks").onclick = () => location.hash = "#/works";

let current = null, items = [];
async function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const [p, c] = h.split("/");
  if(p === "admin"){ location.hash = "#/"; openLogin(); return; }
  if(p === "works" && CATS[c]){ show("gallery"); loadGallery(c); }
  else if(p === "works"){ show("works"); }
  else show("home");
}
window.addEventListener("hashchange",route);

function headers(){
  const h = { "Accept":"application/vnd.github+json" };
  if(isAdmin()) h.Authorization = "Bearer " + getToken();
  return h;
}
async function fetchList(cat){
  const r = await fetch(`${API}/images/${cat}?ref=${CONFIG.branch}&t=${Date.now()}`, { headers: headers(), cache:"no-store" });
  if(r.status === 404) return [];
  if(!r.ok) throw new Error("تعذر تحميل الصور");
  const data = await r.json();
  return data.filter(f => /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name))
             .sort((a,b)=> b.name.localeCompare(a.name))
             .map(f => ({ name:f.name, sha:f.sha, url:f.download_url, path:f.path }));
}
async function loadGallery(cat){
  current = cat;
  $("#gTitle").textContent = CATS[cat].name;
  $("#gCount").textContent = "جاري التحميل...";
  $("#grid").innerHTML = "";
  $("#adminBar").classList.toggle("on", isAdmin());
  try{
    items = await fetchList(cat);
  }catch(err){
    items = [];
    $("#grid").innerHTML = `<div class="empty"><b>تعذر تحميل الصور</b>تأكد من اتصالك بالإنترنت وحاول مرة أخرى.</div>`;
    $("#gCount").textContent = ""; return;
  }
  renderGrid();
}
function renderGrid(){
  $("#gCount").textContent = items.length ? `${items.length} صورة` : "";
  const g = $("#grid");
  if(!items.length){
    g.innerHTML = `<div class="empty"><b>لا توجد صور بعد</b>${isAdmin() ? "اضغط «إضافة صور» لرفع أول أعمالك." : "سيتم إضافة الأعمال قريباً."}</div>`;
    return;
  }
  g.innerHTML = "";
  items.forEach((it,i)=>{
    const t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = `<button class="tile" style="width:100%;height:100%" aria-label="عرض الصورة ${i+1}"><img loading="lazy" src="${it.url}" alt="${CATS[current].name} ${i+1}"></button>`;
    t.firstChild.onclick = () => openLB(i);
    if(isAdmin()){
      const d = document.createElement("button");
      d.className = "del"; d.textContent = "×"; d.setAttribute("aria-label","حذف");
      d.onclick = ev => { ev.stopPropagation(); removeImage(it); };
      t.appendChild(d);
    }
    g.appendChild(t);
  });
}

let li = 0;
function openLB(i){ li = i; $("#lb").classList.add("on"); updLB(); document.body.style.overflow="hidden"; }
function closeLB(){ $("#lb").classList.remove("on"); document.body.style.overflow=""; }
function updLB(){ $("#lbImg").src = items[li].url; $("#lbCount").textContent = `${li+1} / ${items.length}`; }
function stepLB(d){ li = (li + d + items.length) % items.length; updLB(); }
$("#lbClose").onclick = closeLB;
$("#lbPrev").onclick = () => stepLB(-1);
$("#lbNext").onclick = () => stepLB(1);
$("#lb").addEventListener("click",e=>{ if(e.target.id==="lb") closeLB(); });
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("on")) return;
  if(e.key==="Escape") closeLB();
  if(e.key==="ArrowRight") stepLB(-1);
  if(e.key==="ArrowLeft") stepLB(1);
});
let sx = null;
$("#lb").addEventListener("touchstart",e=>{ sx = e.touches[0].clientX; },{passive:true});
$("#lb").addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50) stepLB(dx > 0 ? -1 : 1);
});

function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms); }
function openLogin(){ $("#login").classList.add("on"); $("#tokenInput").value=""; setTimeout(()=>$("#tokenInput").focus(),50); }
$("#tokenCancel").onclick = () => $("#login").classList.remove("on");
$("#tokenOk").onclick = async () => {
  const tk = $("#tokenInput").value.trim(); if(!tk) return;
  try{
    const r = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`, { headers:{ Authorization:"Bearer "+tk, Accept:"application/vnd.github+json" }});
    const j = await r.json();
    if(!r.ok || !(j.permissions && j.permissions.push)) throw 0;
    localStorage.setItem(TOKEN_KEY, tk);
    $("#login").classList.remove("on");
    toast("تم تسجيل الدخول كمدير");
    if(current) loadGallery(current);
  }catch(e){ toast("الرمز غير صحيح أو لا يملك صلاحية الكتابة"); }
};
$("#logoutBtn").onclick = () => { try{localStorage.removeItem(TOKEN_KEY)}catch(e){} $("#adminBar").classList.remove("on"); renderGrid(); toast("تم الخروج"); };
$("#addBtn").onclick = () => $("#fileInput").click();

let taps = 0, tapT;
$("#logoBox").addEventListener("click",()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500); if(taps>=5){ taps=0; openLogin(); }});

function compress(file, max=1600, q=.85){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      res(c.toDataURL("image/jpeg",q).split(",")[1]);
    };
    img.onerror = rej; img.src = u;
  });
}
$("#fileInput").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  if(!files.length || !current) return;
  let ok = 0;
  for(let i=0;i<files.length;i++){
    toast(`جاري رفع الصورة ${i+1} من ${files.length}...`, 60000);
    try{
      const b64 = await compress(files[i]);
      const name = `${Date.now()}-${i}.jpg`;
      const r = await fetch(`${API}/images/${current}/${name}`, {
        method:"PUT", headers:{ ...headers(), "Content-Type":"application/json" },
        body: JSON.stringify({ message:`add ${current} image`, content:b64, branch:CONFIG.branch })
      });
      if(!r.ok) throw 0; ok++;
    }catch(err){ toast("فشل رفع إحدى الصور"); }
  }
  toast(`تم رفع ${ok} صورة`);
  loadGallery(current);
};
async function removeImage(it){
  if(!confirm("هل تريد حذف هذه الصورة نهائياً؟")) return;
  const r = await fetch(`${API}/${it.path}`, {
    method:"DELETE", headers:{ ...headers(), "Content-Type":"application/json" },
    body: JSON.stringify({ message:"delete image", sha:it.sha, branch:CONFIG.branch })
  });
  if(r.ok){ toast("تم الحذف"); items = items.filter(x=>x!==it); renderGrid(); }
  else toast("تعذر الحذف");
}

buildHome();
route();
</script>
</body>
</html>
